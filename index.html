<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>창구 대기 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>창구 대기 계산기</h1>
    <p class="lead">창구 1개에 손님이 도착하는 간격과 처리 시간을 넣으면 평균 대기 시간을 계산합니다</p>

    <label for="arrival">평균 도착 간격 (분)</label>
    <input id="arrival" type="number" value="6" min="0.1" step="0.1">

    <label for="service">평균 처리 시간 (분)</label>
    <input id="service" type="number" value="4.5" min="0.1" step="0.1">

    <button id="calc">계산하기</button>

    <section id="result" class="result" aria-live="polite"></section>
    <p class="note">M/M/1 대기행렬 공식 사용, 수업 연습용 예제</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
